[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harness"
version = "0.1.0"
description = "Modular agent harness — everything is a plugin"
authors = [{name = "Harness Authors"}]
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "pydantic>=2.5.0,<3.0.0",
    "structlog>=26.1.0",
    "httpx>=0.24.0",
    "click>=8.0.0",
    "watchdog>=7.1.0",
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn>=0.28.0",
    "PyYAML>=6.0.0",
    "psutil>=5.9.0",
    "python-multipart>=0.0.33",
    'tomli>=1.1.0; python_version < "3.11"',
]

[project.optional-dependencies]
llm = ["litellm>=1.100.4"]
docker = ["docker>=7.2.0"]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-timeout",
    "ruff==0.11.0",
    "mypy==2.4.1",
    "types-PyYAML",
    "rich>=13.0.0",
    "requests>=2.34.2",
    "youtube-transcript-api>=0.6.0",
    "jsonschema>=4.20.0",
    "numpy>=1.26.0",
    "scipy>=1.17.1",
    "magika>=0.5.0",
    "ontology-spider @ git+https://github.com/SpectreDeath/Ontology-Spider.git",
]

[project.scripts]
harness = "harness.cli:main"

[project.entry-points."harness.plugins"]
# Built-in plugins register here

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"harness.ui.static" = ["*.html"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    ".git",
    ".venv",
    "venv",
    ".harness",
    ".gemini",
    "node_modules",
    "dist",
    "build",
    "test_ingested_plugins",
    "plugins/external",
]

[tool.ruff.lint]
select = [
    "E9",
    "F",
]
ignore = [
    "F401",
    "F841",
    "BLE001",
    "S110",
    "RUF012",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
timeout = 60
timeout_method = "thread"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: fast, self-contained unit tests",
    "integration: tests requiring external services or network",
    "slow: intentionally slow tests",
]

[tool.coverage.run]
source = ["src/harness"]
omit = [
    "*/site-packages/*",
    "*/tests/*",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pyright]
extraPaths = [".", "src"]

