[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harness"
version = "0.1.0"
description = "Modular agent harness — everything is a plugin"
authors = [{name = "Harness Authors"}]
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "pydantic>=2.5.0,<3.0.0",
    "structlog>=23.0.0",
    "httpx>=0.24.0",
    "click>=8.0.0",
    "watchdog>=3.0.0",
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn>=0.28.0",
]

[project.optional-dependencies]
llm = ["litellm>=1.0.0"]
docker = ["docker>=7.0.0"]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-timeout",
    "ruff==0.11.0",
    "mypy==1.15.0",
]

[project.scripts]
harness = "harness.cli:main"

[project.entry-points."harness.plugins"]
# Built-in plugins register here

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
ignore = [
    "BLE001",
    "S110",
    "RUF012",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
timeout = 60
timeout_method = "thread"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: fast, self-contained unit tests",
    "integration: tests requiring external services or network",
    "slow: intentionally slow tests",
]

[tool.coverage.run]
source = ["src/harness"]
omit = [
    "*/site-packages/*",
    "*/tests/*",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
