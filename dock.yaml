name: brain-harness
description: "Brain Harness agent dock — workstation port for inspecting, testing, and driving the micro-kernel"
version: "0.1.0"

permissions:
  read: true
  run: true
  write: true
  push: false

boundaries:
  paths:
    - ".git/"
    - ".env"
    - ".pytest_cache/"
    - "src/harness/ui/static/"
  operations:
    - "git push --force"
    - "git reset --hard"
    - "git clean -fd"

tools:
  - "fs_read_file"
  - "fs_search_text"
  - "fs_git_status"
  - "fs_git_diff"
  - "run_pytest"

entrypoints:
  vault-stats:
    description: "Display knowledge graph and vault statistics"
    write_path: false
    steps:
      - command: "python -m harness.cli knowledge stats"
        workdir: "."
        expected_output: "Knowledge Graph Census Statistics"

  verify-core:
    description: "Run targeted dock verification tests"
    write_path: false
    steps:
      - command: "pytest tests/test_service_dock.py tests/test_command_dock.py -v"
        workdir: "."

  sync-context:
    description: "Lint and verify codebase context and instruction file hygiene"
    write_path: true
    steps:
      - command: "python -m harness.cli context lint --root ."
        workdir: "."

  verify-ontology:
    description: "Verify ontology reasoning, vault traversal, and proof traces via Ontology-Spider"
    write_path: false
    steps:
      - command: "pytest plugins/memory_and_epistemics/ontology_spider/test_ontology_spider_plugin.py -v"
        workdir: "."


