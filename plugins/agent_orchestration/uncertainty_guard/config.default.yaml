# Baseline Operational Budgets for uncertainty_guard Plugin (Rule 44)
# Grounded in Chidiebere Njoku (2026) - ki_njoku_uncertainty_aware_systems

version: "1.0.0"

boundary:
  similarity_threshold: 0.45
  timeout_ms: 10.0
  target_domains:
    - "company VPN configuration"
    - "employee payroll schedules"
    - "internal IT software deployment"
    - "benefits enrollment and health insurance"
    - "enterprise single sign-on authentication"

retrieval:
  minimum_relevance: 0.60
  max_chunks_to_score: 20
  timeout_ms: 25.0

logprob:
  logprob_threshold: -0.35
  max_perplexity: 1.42

telemetry:
  escalation_queue_max_size: 1000
  cluster_min_size_for_debt: 2
