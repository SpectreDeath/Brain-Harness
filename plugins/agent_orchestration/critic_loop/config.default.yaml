# Critic Evaluation Service Configuration Defaults (Rule 44 Zero-Fork Config)
version: "1.0.0"

operational_budgets:
  default_rubric_threshold: 0.85
  max_refinement_iterations: 3
  max_code_analysis_loc: 5000
  command_timeout_seconds: 15.0
  max_debate_rounds: 10
  cache_ttl_seconds: 300

runtime:
  strict_safety_blocking: true
  allow_eval_exec_calls: false
  default_language: "python"
