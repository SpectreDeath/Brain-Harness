# Architecture Linter Configuration Defaults (Rule 44 Zero-Fork Config)
version: "1.0.0"

operational_budgets:
  max_scanned_files: 5000
  timeout_seconds: 30.0
  instability_threshold: 0.80
  cache_ttl_seconds: 300

runtime:
  enforce_clean_architecture: true
  layer_hierarchy:
    - "kernel"
    - "events"
    - "services"
    - "plugins"
