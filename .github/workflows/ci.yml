name: CI

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Code Quality (Ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install linter
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.11.0

      - name: Run Ruff Lint Check
        run: |
          ruff check .

      - name: Run Scoped Ruff Format Check
        run: |
          ruff format --check src/harness/kernel src/harness/services/brain_bridge src/harness/services/deep_auditor src/harness/services/harness_spawner src/harness/services/dock src/harness/commands/reflection plugins/software_engineering/deep_repo_auditor tests/test_service_deep_auditor.py

  frontend:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint Frontend
        working-directory: frontend
        run: npm run lint

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

  test:
    name: Test Suite (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    needs: [lint]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11"]
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.12"
    env:
      PYTHONPATH: .:src
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Fast Unit Tests (Gate)
        run: |
          pytest -m "unit" -q --timeout=60

      - name: Architectural & Epistemic Hygiene Gates
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: |
          mypy src/harness/kernel --ignore-missing-imports
          python -m harness.cli context lint
          python -m harness.cli knowledge sync --strict

      - name: Integration & Contract Tests (Coverage)
        run: |
          pytest -m "not slow" -q --timeout=120 --junitxml=test-report.xml --cov=src/harness --cov-report=xml

      - name: Continuous Knowledge Distillation
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        continue-on-error: true
        run: |
          python -m harness.cli reflect --test-report test-report.xml --no-html --no-commit
