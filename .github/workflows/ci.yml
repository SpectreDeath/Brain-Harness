name: CI

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Code Quality (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install linter
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.11.0

      - name: Run Ruff Lint Check
        run: |
          ruff check .

  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Pytest
        env:
          PYTHONPATH: .:src
        run: |
          pytest -q --timeout=120 --junitxml=test-report.xml

      - name: Continuous Knowledge Distillation
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && matrix.python-version == '3.11'
        env:
          PYTHONPATH: .:src
          PYTHONIOENCODING: utf-8
        run: |
          python -m harness.cli reflect --test-report test-report.xml --no-html --no-commit
