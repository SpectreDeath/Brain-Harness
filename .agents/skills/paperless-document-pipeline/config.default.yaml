# Paperless Document Pipeline Skill Default Configuration (3-tier zero-fork)
paperless_base_url: "http://localhost:8000"
timeout_seconds: 30.0
default_search_limit: 10
enable_mock_fallback: true
polling_interval_seconds: 2.0
max_task_poll_attempts: 15
rag_retriever_top_k: 5
supported_extensions:
  - ".pdf"
  - ".png"
  - ".jpg"
  - ".jpeg"
  - ".tiff"
  - ".txt"
  - ".docx"
  - ".eml"
extra_supported_extensions: []
