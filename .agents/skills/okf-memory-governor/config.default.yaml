# OKF Memory Governor — Operational Budget & Configuration
version: "1.0.0"

bundle:
  default_dir: "knowledge"
  max_bundle_files: 2000
  allowed_types:
    - "decision"
    - "architecture"
    - "operational"
    - "concept"

search:
  default_limit: 3
  max_limit: 20
  bm25:
    k1: 1.2
    b: 0.75
    governance_boost: 1.5
    title_boost: 3.0
    description_boost: 2.0
    id_boost: 2.0

governance:
  enforce_pre_edit_scope: true
  block_on_governance_rules: true
  prohibit_human_self_attestation: true

validation:
  strict_mode: false
  min_description_chars: 10
  verify_code_refs_exist: false

execution:
  timeout_seconds: 30
  retry_limit: 3
  token_budget_limit: 4096
